name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  lint:
    name: Flake8 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 pipelines/ scripts/ tests/ \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --ignore=E402,W503

  tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spacy model
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_cache.py

      - name: Run cache tests
        run: pytest tests/test_cache.py -v

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: lint
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spacy model
        run: python -m spacy download en_core_web_sm

      - name: Run coverage
        run: |
          pytest tests/ \
            --cov=pipelines \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  evaluate:
    name: Evaluation
    runs-on: ubuntu-latest
    needs: tests
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spacy model
        run: python -m spacy download en_core_web_sm

      - name: Run token_prob evaluation
        run: python3 -m pipelines.token_prob.evaluate

      - name: Run entailment evaluation
        run: python3 -m pipelines.entailment.evaluate

      - name: Run selfcheck evaluation
        run: python3 -m pipelines.selfcheck.evaluate

      - name: Assemble final table
        run: python3 -m scripts.assemble_final_table
